<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Ilustración abstracta de pruebas de software y control de calidad">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#213a58"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fc3b3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4fc3b3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#b7c4d2" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <circle cx="1150" cy="420" r="420" fill="url(#glow)"/>

  <!-- Tarjeta central: lista de pruebas -->
  <rect x="480" y="190" width="640" height="520" rx="28" fill="#ffffff" fill-opacity="0.06" stroke="#b7c4d2" stroke-opacity="0.25" stroke-width="2"/>

  <g>
    <circle cx="560" cy="290" r="22" fill="#4fc3b3"/>
    <path d="M550 290 l8 8 l16 -18" fill="none" stroke="#0d1b2e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="610" y="278" width="380" height="14" rx="7" fill="#b7c4d2" fill-opacity="0.55"/>
    <rect x="610" y="302" width="240" height="10" rx="5" fill="#b7c4d2" fill-opacity="0.25"/>
  </g>
  <g>
    <circle cx="560" cy="400" r="22" fill="#4fc3b3"/>
    <path d="M550 400 l8 8 l16 -18" fill="none" stroke="#0d1b2e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="610" y="388" width="320" height="14" rx="7" fill="#b7c4d2" fill-opacity="0.55"/>
    <rect x="610" y="412" width="200" height="10" rx="5" fill="#b7c4d2" fill-opacity="0.25"/>
  </g>
  <g>
    <circle cx="560" cy="510" r="22" fill="none" stroke="#4fc3b3" stroke-width="4"/>
    <rect x="610" y="498" width="400" height="14" rx="7" fill="#b7c4d2" fill-opacity="0.4"/>
    <rect x="610" y="522" width="260" height="10" rx="5" fill="#b7c4d2" fill-opacity="0.18"/>
  </g>
  <g>
    <circle cx="560" cy="620" r="22" fill="none" stroke="#b7c4d2" stroke-opacity="0.5" stroke-width="4"/>
    <rect x="610" y="608" width="300" height="14" rx="7" fill="#b7c4d2" fill-opacity="0.3"/>
    <rect x="610" y="632" width="180" height="10" rx="5" fill="#b7c4d2" fill-opacity="0.15"/>
  </g>

  <!-- Barra de progreso -->
  <rect x="560" y="672" width="480" height="10" rx="5" fill="#b7c4d2" fill-opacity="0.15"/>
  <rect x="560" y="672" width="330" height="10" rx="5" fill="#4fc3b3"/>

  <!-- Elementos flotantes: ciclo de prueba -->
  <circle cx="300" cy="260" r="64" fill="none" stroke="#4fc3b3" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="12 10"/>
  <circle cx="300" cy="260" r="10" fill="#4fc3b3"/>
  <circle cx="1300" cy="640" r="48" fill="none" stroke="#b7c4d2" stroke-opacity="0.4" stroke-width="3"/>
  <path d="M1270 640 h60 M1300 610 v60" stroke="#b7c4d2" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round"/>
  <rect x="1180" y="180" width="220" height="120" rx="20" fill="none" stroke="#b7c4d2" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="1206" y="210" width="90" height="10" rx="5" fill="#b7c4d2" fill-opacity="0.35"/>
  <rect x="1206" y="234" width="150" height="10" rx="5" fill="#b7c4d2" fill-opacity="0.2"/>
  <rect x="1206" y="258" width="60" height="10" rx="5" fill="#4fc3b3" fill-opacity="0.8"/>
</svg>
